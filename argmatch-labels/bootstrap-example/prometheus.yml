global:
  scrape_interval: 5s
  evaluation_interval: 5s
  metric_name_validation_scheme: utf8
scrape_configs:
  - job_name: prometheus-meta
    scrape_protocols: [OpenMetricsText1.0.0, PrometheusText1.0.0, OpenMetricsText0.0.1, PrometheusText0.0.4]
    static_configs:
      - targets: ["localhost:9090"]
    relabel_configs:
      - action: replace
        target_label: pod
        replacement: prombench
  - job_name: prombench
    static_configs:
      - targets: ["127.0.0.1:9090"]
